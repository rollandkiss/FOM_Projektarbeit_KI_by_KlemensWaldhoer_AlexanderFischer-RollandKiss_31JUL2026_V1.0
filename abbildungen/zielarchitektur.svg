  <text x="480" y="166" fill="#5c6773" font-size="11px">(GCP e2-medium) — deterministischer Orderpfad</text>

  <rect x="386" y="180" width="378" height="38" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="398" y="203" fill="#1a2027" font-size="14px" font-weight="bold">marketdata-Replik <tspan fill="#5c6773" font-size="11px">(rsync, minütlich, atomar)</tspan></text>

  <rect x="386" y="232" width="378" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="398" y="252" fill="#1a2027" font-size="14px" font-weight="bold">strategy.py — SMA-Regime (Plugin-System)</text>
  <text x="398" y="268" fill="#5c6773" font-size="11px">LONG wenn SMA50 &gt; SMA200 · DecisionRequest, Audit-Flags, Kosten</text>

  <rect x="386" y="296" width="378" height="72" rx="6" fill="#eaf1fe" stroke="#2f6fd6" stroke-width="1.3"/>
  <text x="398" y="315" fill="#1a2027" font-size="13px" font-weight="bold">mlforecast.py — statistische Prüfinstanz (scikit-learn)</text>
  <text x="398" y="332" fill="#5c6773" font-size="11px">Logistische Regression · Walk-Forward-validiert · Training So. 15:00 UTC</text>
  <text x="398" y="347" fill="#5c6773" font-size="11px">Sidecar: journalisiert nur (ml_predictions) · Live: ML-Kontext an Voten</text>
  <text x="398" y="362" fill="#5c6773" font-size="11px">Soft-Flag ML_DISAGREE (p &lt; 0,45) · Ausfall blockiert den Zyklus nie</text>

  <rect x="386" y="382" width="378" height="150" rx="6" fill="#eaf1fe" stroke="#2f6fd6" stroke-width="1.3"/>
  <text x="398" y="402" fill="#1a2027" font-size="14px" font-weight="bold">auditor.py — Multi-LLM-Voting (bounded discretion)</text>
  <text x="398" y="420" fill="#1a2027" font-size="13px">1. Pre-Gate: harte Flags → NO_TRADE ohne Modellaufruf</text>
  <text x="398" y="438" fill="#1a2027" font-size="13px">2. Unabhängige Voten: qwen3.5 → gemma4 → deepseek-v4-pro</text>
  <text x="398" y="456" fill="#1a2027" font-size="13px">3. Strikte Mehrheit 2/3 · Early-Stop · konservativste Größe</text>
  <text x="398" y="474" fill="#1a2027" font-size="13px">4. Validator (fail-safe): Veto bei Schemabruch/Uneinigkeit</text>
  <text x="398" y="492" fill="#5c6773" font-size="11px">Modelle können verhindern/verkleinern — nie erzeugen/umkehren</text>
  <text x="398" y="510" fill="#5c6773" font-size="11px">Journal: decisions.sqlite (Voten, Begründungen, Latenz)</text>

  <rect x="386" y="546" width="378" height="106" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="398" y="566" fill="#1a2027" font-size="14px" font-weight="bold">orchestrate.py — abgesicherte Ausführung</text>
  <text x="398" y="584" fill="#5c6773" font-size="11px">Kursfrische- &amp; Orderbuch-Gate · Intent-Journal (Doppelorder-Schutz)</text>
  <text x="398" y="600" fill="#5c6773" font-size="11px">Circuit-Breaker · Reconciliation bei unklarem Status → Alarm + Pause</text>
  <rect x="398" y="612" width="354" height="30" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="408" y="631" fill="#5c6773" font-size="11px">Regime-Ausstieg und Richtungsumkehr (deterministisch, Depotbeleg)</text>

  <rect x="386" y="666" width="378" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="398" y="686" fill="#1a2027" font-size="14px" font-weight="bold">broker.py — comdirect-Adapter</text>
  <text x="398" y="702" fill="#5c6773" font-size="10.5px">OAuth2 · Session-TAN · Limit-Orders (GFD) · Trailing-Stop-Schutz (GTD)</text>

  <text x="386" y="740" fill="#5c6773" font-size="10.5px">Kill-Switch-Flag · flock je Konto · Handelszyklus Cron 13:25 UTC (run_cycle.sh)</text>
  <text x="386" y="758" fill="#5c6773" font-size="11px">Heartbeat + Journal-Backup → collector-vm (einweg)</text>
  <text x="386" y="776" fill="#5c6773" font-size="11px">Wochenauswertung So. 16:30 UTC (Voten-Qualität + ML-Kalibrierung)</text>


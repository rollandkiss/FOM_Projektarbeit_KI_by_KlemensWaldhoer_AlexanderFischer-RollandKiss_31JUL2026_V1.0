# =============================================================================
# wknassign.yaml -- Zentrale Produktzuordnung des Handelsagenten (REINE DATEN)
# Ersetzt die einzelnen wknassign_<name>.py-Dateien (aggregierte Singulärdatei).
#
# Regeln (vom Handler strategy.py beim Laden erzwungen):
#   * Jeder Schlüssel unter 'assignments' MUSS einem Plugin plstrategy_<name>.py
#     entsprechen -- verwaiste Einträge sind ein Ladefehler (Tippschutz).
#   * 'underlying' muss dem Underlying der Strategie entsprechen.
#   * ISINs müssen im INSTRUMENT_CATALOG (strategy.py) existieren; Metadaten
#     (Kurs, Spread, Status) liegen NUR dort -- hier stehen Präferenzlisten.
#   * Strategie ohne Eintrag = backtestbar, aber nicht handelbar (NO_INSTRUMENT).
#   * Reihenfolge = Präferenz: erstes geeignetes Instrument gewinnt.
# =============================================================================

version: 1

assignments:

  sma:                              # Einheit mit plstrategy_sma.py
    underlying: "^GSPC"
    LONG:
      - "DE000SB295Z1"              # SG Faktor 2x Long (strategischer Beginn)
      - "DE000PF2SP50"              # BNP 2x Long (Fallback nach Spread-Benchmark)
    SHORT:
      - "DE000SD5PHQ2"              # SG Faktor 2x Short (strategischer Beginn)
      - "DE000PX2PXP7"              # BNP 2x Short (Fallback nach Spread-Benchmark)
    constraints: {}                 # optionale Overrides, z. B. {spread_bp_max: 30}

  smacross:                         # Einheit mit plstrategy_smacross.py
    underlying: "^GSPC"
    LONG:  ["DE000SB295Z1", "DE000PF2SP50"]
    SHORT: ["DE000SD5PHQ2", "DE000PX2PXP7"]
    constraints: {}

  momentum:                         # Einheit mit plstrategy_momentum.py
    underlying: "^GSPC"
    LONG:  ["DE000SB295Z1"]
    SHORT: ["DE000SD5PHQ2"]
    constraints: {}

  smatrend:                         # Einheit mit plstrategy_smatrend.py (LONG/CASH)
    underlying: "^GSPC"
    LONG:
      - "DE000SB295Z1"              # SG Faktor 2x Long
      - "DE000PF2SP50"              # BNP 2x Long (Fallback)
    # KEIN SHORT: Bärenregime = Cash (Transkript-Strategie)
    constraints: {}

# buyhold: bewusst OHNE Eintrag -- Benchmark, nicht handelbar (NO_INSTRUMENT).

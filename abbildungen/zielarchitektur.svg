  <rect x="56" y="250" width="238" height="56" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="68" y="270" fill="#1a2027" font-size="14px" font-weight="bold">datacollect.py</text>
  <text x="68" y="286" fill="#5c6773" font-size="11px">Rohticks → Bars · Sanity · 24/7</text>
  <rect x="56" y="316" width="238" height="50" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="68" y="335" fill="#1a2027" font-size="14px" font-weight="bold">FRED-Crosscheck</text>
  <text x="68" y="351" fill="#5c6773" font-size="11px">datumskorrekt, SUSPECT-Alarm</text>
  <rect x="56" y="376" width="238" height="40" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="68" y="394" fill="#1a2027" font-size="14px" font-weight="bold">marketdata.sqlite</text>

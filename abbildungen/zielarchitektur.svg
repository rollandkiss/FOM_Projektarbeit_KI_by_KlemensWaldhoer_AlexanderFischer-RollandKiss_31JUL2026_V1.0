  <text x="40" y="36" font-size="21" font-weight="bold" fill="#1a2027">Zielarchitektur des autonomen Handelsagenten</text>
  <text x="40" y="58" fill="#5c6773" font-size="11px">Stand 28.07.2026 — durchgezogen = umgesetzt und im Echtgeldbetrieb · gestrichelt = geplant</text>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/>
    </marker>
  </defs>
  <style>
    .zone{fill:#f8fafc;stroke:#64748b;stroke-width:1.4;rx:10}
    .zoneplan{fill:none;stroke:#64748b;stroke-width:1.4;stroke-dasharray:7 5}
    .box{fill:#ffffff;stroke:#334155;stroke-width:1.2}
    .boxplan{fill:#ffffff;stroke:#64748b;stroke-width:1.2;stroke-dasharray:6 4}
    .hl{fill:#eaf1fe;stroke:#2f6fd6;stroke-width:1.3}
    .t{fill:#1a2027;font-size:13px}
    .ts{fill:#5c6773;font-size:11px}
    .th{fill:#1a2027;font-size:14px;font-weight:bold}
    .tz{fill:#334155;font-size:15px;font-weight:bold}
    .flow{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arr)}
    .flowb{stroke:#2f6fd6;stroke-width:1.5;fill:none;marker-end:url(#arrb)}
    .flowp{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#arr)}
  </style>

  <text x="40" y="36" font-size="21" font-weight="bold" fill="#1a2027">Zielarchitektur des autonomen Handelsagenten</text>
  <text x="40" y="58" class="ts">Stand 21.07.2026 — durchgezogen = umgesetzt (Live-/Dry-Run-Betrieb) · gestrichelt = geplant</text>

  <!-- Legende -->
  <g>
    <rect x="930" y="20" width="270" height="46" rx="8" class="zone"/>
    <line x1="945" y1="38" x2="985" y2="38" stroke="#334155" stroke-width="1.6"/>
    <text x="992" y="42" class="t">umgesetzt</text>
    <line x1="1080" y1="38" x2="1120" y2="38" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="1127" y="42" class="t">geplant</text>
  </g>

  <!-- Datenquellen -->
  <rect x="40" y="86" width="180" height="42" rx="6" class="box"/>
  <text x="52" y="104" class="th">Yahoo Finance</text>
  <text x="52" y="120" class="ts">WebSocket + Futures-Poll</text>
  <rect x="40" y="140" width="180" height="42" rx="6" class="box"/>
  <text x="52" y="158" class="th">FRED (St. Louis Fed)</text>
  <text x="52" y="174" class="ts">offizielle EOD-Zweitquelle</text>

  <!-- collector-vm -->
  <rect x="40" y="210" width="270" height="320" rx="10" class="zone"/>
  <text x="56" y="236" class="tz">collector-vm</text>
  <text x="180" y="236" class="ts">(GCP e2-micro, Free Tier)</text>
  <rect x="56" y="250" width="238" height="56" rx="6" class="box"/>
  <text x="68" y="270" class="th">datacollect.py</text>
  <text x="68" y="286" class="ts">Rohticks → Bars · Sanity · 24/7</text>
  <rect x="56" y="316" width="238" height="50" rx="6" class="box"/>
  <text x="68" y="335" class="th">FRED-Crosscheck</text>
  <text x="68" y="351" class="ts">datumskorrekt, SUSPECT-Alarm</text>
  <rect x="56" y="376" width="238" height="40" rx="6" class="box"/>
  <text x="68" y="394" class="th">marketdata.sqlite</text>
  <text x="68" y="408" class="ts">WAL · Litestream-Backup → GCS</text>
  <rect x="56" y="426" width="238" height="56" rx="6" class="box"/>
  <text x="68" y="446" class="th">export_journal.py</text>
  <text x="68" y="462" class="ts">minütlich · redigierte JSON-Feeds</text>
  <text x="56" y="516" class="ts">Dead-Man-Switch: überwacht agent-vm (Signal-Alarm)</text>

  <!-- Pfeile Datenquellen -> collector -->
  <path class="flow" d="M130,128 L130,204"/>
  <path class="flow" d="M220,161 C280,161 300,200 292,246"/>

  <!-- agent-vm -->
  <rect x="370" y="140" width="410" height="560" rx="10" class="zone"/>
  <text x="386" y="166" class="tz">agent-vm</text>
  <text x="480" y="166" class="ts">(GCP e2-medium) — deterministischer Orderpfad</text>

  <rect x="386" y="180" width="378" height="38" rx="6" class="box"/>
  <text x="398" y="203" class="th">marketdata-Replik <tspan class="ts">(rsync, minütlich, atomar)</tspan></text>

  <rect x="386" y="232" width="378" height="50" rx="6" class="box"/>
  <text x="398" y="252" class="th">strategy.py — SMA-Regime (Plugin-System)</text>
  <text x="398" y="268" class="ts">LONG wenn SMA50 &gt; SMA200 · DecisionRequest, Audit-Flags, Kosten</text>

  <rect x="386" y="296" width="378" height="150" rx="6" class="hl"/>
  <text x="398" y="316" class="th">auditor.py — Multi-LLM-Voting (bounded discretion)</text>
  <text x="398" y="334" class="t">1. Pre-Gate: harte Flags → NO_TRADE ohne Modellaufruf</text>
  <text x="398" y="352" class="t">2. Unabhängige Voten: qwen3.5 → gemma4 → deepseek-v4</text>
  <text x="398" y="370" class="t">3. Strikte Mehrheit 2/3 · Early-Stop · konservativste Größe</text>
  <text x="398" y="388" class="t">4. Validator (fail-safe): Veto bei Schemabruch/Uneinigkeit</text>
  <text x="398" y="406" class="ts">Modelle können verhindern/verkleinern — nie erzeugen/umkehren</text>
  <text x="398" y="424" class="ts">Journal: decisions.sqlite (Voten, Begründungen, Latenz)</text>

  <rect x="386" y="460" width="378" height="106" rx="6" class="box"/>
  <text x="398" y="480" class="th">orchestrate.py — abgesicherte Ausführung</text>
  <text x="398" y="498" class="ts">Frische-Gate · Intent-Journal (Doppelorder-Schutz) · Circuit-Breaker</text>
  <text x="398" y="514" class="ts">Orderbuch-Reconciliation bei unklarem Status → Alarm + Pause</text>
  <rect x="398" y="526" width="354" height="30" rx="5" class="boxplan"/>
  <text x="408" y="545" class="ts">geplant: Soll-Positions-Abgleich (deterministischer Ausstieg)</text>

  <rect x="386" y="580" width="378" height="50" rx="6" class="box"/>
  <text x="398" y="600" class="th">broker.py — comdirect-Adapter</text>
  <text x="398" y="616" class="ts">OAuth2 · Session-TAN (TAN_FREI) · Limit-Orders · Live nur je Konto</text>

  <text x="386" y="660" class="ts">Kill-Switch-Flag · flock je Konto · Cron 13:25 UTC (run_cycle.sh)</text>
  <text x="386" y="678" class="ts">Heartbeat + Journal-Backup → collector-vm (einweg)</text>

  <!-- Flusspfeile agent-vm -->
  <path class="flow" d="M310,404 L364,404"/>
  <text x="316" y="396" class="ts">rsync</text>
  <path class="flow" d="M575,218 L575,228"/>
  <path class="flow" d="M575,282 L575,292"/>
  <path class="flow" d="M575,446 L575,456"/>
  <path class="flow" d="M575,566 L575,576"/>

  <!-- LLM-Inferenz -->
  <rect x="820" y="140" width="380" height="190" rx="10" class="zone"/>
  <text x="836" y="166" class="tz">LLM-Inferenz</text>
  <text x="948" y="166" class="ts">Ollama — EINE Schnittstelle, zwei Betriebsformen</text>
  <rect x="836" y="180" width="348" height="60" rx="6" class="box"/>
  <text x="848" y="200" class="th">Ollama Cloud <tspan class="ts">(umgesetzt)</tspan></text>
  <text x="848" y="216" class="ts">gemma4 · qwen3.5 · deepseek-v4-pro</text>
  <text x="848" y="231" class="ts">JSON-Schema erzwungen · Temperature 0 · think=false</text>
  <rect x="836" y="252" width="348" height="60" rx="6" class="boxplan"/>
  <text x="848" y="272" class="th">Mac mini, lokal <tspan class="ts">(geplant — Konfigurationswechsel)</tspan></text>
  <text x="848" y="288" class="ts">gemma4:12b · qwen3.5:9b · gpt-oss:20b</text>
  <text x="848" y="303" class="ts">Datenhoheit · keine Inferenzkosten · timeout_s-Anpassung</text>
  <path class="flowb" d="M764,340 C800,340 800,300 816,290"/>
  <path class="flowb" d="M816,220 C800,215 790,300 766,320"/>

  <!-- comdirect -->
  <rect x="820" y="360" width="380" height="180" rx="10" class="zone"/>
  <text x="836" y="386" class="tz">comdirect (Bank)</text>
  <rect x="836" y="400" width="348" height="56" rx="6" class="box"/>
  <text x="848" y="420" class="th">REST-API — Hauptdepot (sma)</text>
  <text x="848" y="436" class="ts">Validation + Ex-Ante-Kosten → Execution · Orderbuch (read-only)</text>
  <rect x="836" y="466" width="348" height="56" rx="6" class="boxplan"/>
  <text x="848" y="486" class="th">Zweitdepot (smatrend) <tspan class="ts">(geplant)</tspan></text>
  <text x="848" y="502" class="ts">A/B-Vergleich beider Strategien · eigener Zugang + Journal</text>
  <path class="flow" d="M764,605 C800,605 810,470 830,442"/>

  <!-- Mensch / Signal -->
  <rect x="370" y="724" width="410" height="120" rx="10" class="zone"/>
  <text x="386" y="750" class="tz">Mensch</text>
  <text x="460" y="750" class="ts">(Signal-Messenger, Echtzeit)</text>
  <text x="386" y="774" class="t">photoTAN-Tagesfreigabe („K") · Tagesreport je Zyklus</text>
  <text x="386" y="792" class="t"><tspan fill="#cd0100" font-weight="bold">Not-Aus P/R/S/F</tspan> (Pause · Resume · Status · Flatten)</text>
  <text x="386" y="810" class="t">Alarme: Orderstatus unklar, Regimewechsel, Betriebsstörungen</text>
  <path class="flow" d="M575,720 L575,684"/>
  <path class="flow" d="M600,684 L600,720"/>

  <!-- Dashboard -->
  <rect x="820" y="570" width="380" height="200" rx="10" class="zone"/>
  <text x="836" y="596" class="tz">Öffentliches Dashboard</text>
  <text x="1030" y="596" class="ts">(read-only, redigiert)</text>
  <rect x="836" y="610" width="160" height="52" rx="6" class="box"/>
  <text x="848" y="630" class="th">GCS-Bucket</text>
  <text x="848" y="646" class="ts">privat · JSON-Feeds</text>
  <rect x="1022" y="610" width="162" height="52" rx="6" class="box"/>
  <text x="1034" y="630" class="th">Cloud Run</text>
  <text x="1034" y="646" class="ts">Flask · Chart.js</text>
  <path class="flow" d="M996,636 L1016,636"/>
  <rect x="836" y="676" width="348" height="52" rx="6" class="box"/>
  <text x="848" y="696" class="th">Browser / Mobilgerät</text>
  <text x="848" y="712" class="ts">S&amp;P-Chart + SMA + Signale · Voten-Drill-Down · barrierefrei mobil</text>
  <path class="flow" d="M1103,662 L1103,672"/>
  <text x="836" y="754" class="ts">Trading-VMs bleiben ohne offenen Port — die Fassade ist zustandslos.</text>

  <!-- Export-Pfeil collector -> GCS (unten herum) -->
  <path class="flow" d="M175,530 L175,860 L910,860 L910,666"/>
  <text x="490" y="852" class="ts">redigierter Feed-Export (keine Kontodaten, minütlich bei Änderung)</text>

  <!-- Migrationsziel Mac mini -->
  <rect x="40" y="586" width="270" height="184" rx="10" class="zoneplan"/>
  <text x="56" y="612" class="tz" fill="#64748b">Migrationsziel Mac mini</text>
  <text x="56" y="636" class="ts">Gesamtbetrieb lokal für den Privatgebrauch:</text>
  <text x="56" y="654" class="ts">· Collector + Agent + LLMs auf einem Gerät</text>
  <text x="56" y="672" class="ts">· launchd statt Cron · lokale Modelle</text>
  <text x="56" y="690" class="ts">· keine Cloud-/Inferenzkosten, volle Datenhoheit</text>
  <text x="56" y="708" class="ts">· ein Codestand — Wechsel = Konfiguration</text>
  <text x="56" y="726" class="ts">· offene Punkte: timeout_s, gtimeout/flock,</text>
  <text x="56" y="742" class="ts">  OLLAMA_MAX_LOADED_MODELS=1</text>
</svg>
